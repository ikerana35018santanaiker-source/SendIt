<!-- XChat full rebuild will go here. Starting skeleton per user request. -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>XChat</title>
<style>
  /* Basic reset + layout */
  body{margin:0;font-family:system-ui,Roboto,Arial;background:#f4f6fa;color:#111;display:flex;min-height:100vh}
  #leftbar{width:70px;background:#fff;border-right:1px solid #e5e7eb;padding:12px;display:none;flex-direction:column;gap:20px;align-items:center}
  #leftbar button{background:none;border:none;font-size:14px;cursor:pointer;color:#444}
  #app{flex:1;display:flex;flex-direction:column;max-width:700px;margin:auto;padding:20px}

  /* Auth UI */
  #authBox{max-width:360px;margin:60px auto;padding:20px;background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,0.08)}
  #authBox h2{text-align:center;margin-bottom:12px}
  input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #d1d5db}
  #authBox button{width:100%;padding:10px;border:none;border-radius:8px;margin-top:10px;background:#3b82f6;color:#fff;font-size:16px;cursor:pointer}

  /* Posts */
  #composer{display:flex;gap:8px;margin-bottom:18px}
  #composer textarea{flex:1;min-height:60px;border-radius:10px;padding:10px;border:1px solid #d1d5db;resize:none}
  #composer button{padding:10px 18px;border:none;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer}

  .post{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;border:1px solid #e5e7eb}
  .post .meta{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .profileIcon{width:40px;height:40px;border-radius:50%;background:#d1d5db}
  .username{font-weight:600}
  .actions{display:flex;gap:16px;margin-top:10px;font-size:14px;color:#666}
  .actions span{cursor:pointer}
</style>
</head>
<body>
<div id="leftbar">
  <button data-sec="inicio">Inicio</button>
  <button data-sec="descubre">Descubre</button>
  <button data-sec="popular">Popular</button>
  <button data-sec="perfil">Perfil</button>
</div>

<div id="app">
  <div id="authBox">
    <h2>XChat — Login</h2>
    <input id="user" placeholder="Nombre de usuario" />
    <button id="loginBtn">Entrar</button>
  </div>

  <div id="mainUI" style="display:none;">
    <div id="composer">
      <textarea id="text" placeholder="¿Qué estás pensando?"></textarea>
      <button id="send">Enviar</button>
    </div>
    <div id="posts"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
// Firebase config (user will fill)
const firebaseConfig = {
  apiKey: "AIzaSyATTtOEPHOi3lBiM9CcgzkCN-MSK50RjY4",
  authDomain: "retwitt-af48c.firebaseapp.com",
  projectId: "retwitt-af48c",
  storageBucket: "retwitt-af48c.firebasestorage.app",
  messagingSenderId: "1000651551704",
  appId: "1:1000651551704:web:89733743b024fd8c4cf8ad",
  measurementId: "G-P5GWG9CEC1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// LOCALSTORAGE SESSION
let currentUser = localStorage.getItem('xchat_user') || null;
const authBox = document.getElementById('authBox');
const mainUI = document.getElementById('mainUI');
const leftbar = document.getElementById('leftbar');

if(currentUser){ showMain(); }

document.getElementById('loginBtn').onclick = ()=>{
  const u = document.getElementById('user').value.trim();
  if(!u) return alert('Escribe un nombre.');
  currentUser = u;
  localStorage.setItem('xchat_user', u);
  showMain();
};

function showMain(){
  authBox.style.display = 'none';
  mainUI.style.display = 'block';
  leftbar.style.display = 'flex';
  loadSection('descubre');
}

// Compose Post
send.onclick = ()=>{
  const txt = text.value.trim();
  if(!txt) return;
  const post = {
    user: currentUser,
    text: txt,
    timestamp: Date.now(),
    likes: 0
  };
  text.value = '';
  db.ref('xposts').push(post);
};

// Render post
function renderPost(key, p){
  const div = document.createElement('div');
  div.className = 'post';
  div.innerHTML = `
    <div class="meta">
      <div class="profileIcon"></div>
      <div>
        <div class="username">${p.user}</div>
        <div style="font-size:12px;color:#777;">${new Date(p.timestamp).toLocaleString()}</div>
      </div>
    </div>
    <div>${escapeHtml(p.text)}</div>
    <div class="actions">
      <span onclick="likePost('${key}')">❤️ ${p.likes||0}</span>
      <span onclick="sharePost('${key}')">🔗 Compartir</span>
    </div>`;
  return div;
}

function escapeHtml(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

// Likes (1 por usuario)
function likePost(id){
  const liked = JSON.parse(localStorage.getItem('xchat_likes')||'{}');
  if(liked[id]) return alert('Ya diste like');
  db.ref('xposts/'+id).transaction(p=>{
    if(p){ p.likes = (p.likes||0)+1; }
    return p;
  });
  liked[id] = true;
  localStorage.setItem('xchat_likes', JSON.stringify(liked));
}

// Share
function sharePost(id){
  const link = `https://xchat-web.netlify.app/?post=${id}`;
  navigator.clipboard.writeText(link);
  alert('Link copiado');
}

// Sections
const postsEl = document.getElementById('posts');
leftbar.querySelectorAll('button').forEach(btn=>{
  btn.onclick = ()=>loadSection(btn.dataset.sec);
});

function loadSection(sec){
  postsEl.innerHTML = '';
  if(sec==='perfil'){
    postsEl.innerHTML = `<button onclick="logout()">Cerrar sesión</button>`;
    return;
  }
  let ref = db.ref('xposts');
  if(sec==='inicio') ref = ref.orderByChild('timestamp');
  if(sec==='descubre') ref = ref.orderByChild('timestamp');
  if(sec==='popular') ref = ref.orderByChild('likes');

  ref.limitToLast(100).once('value',snap=>{
    const arr=[];
    snap.forEach(ch=> arr.push([ch.key,ch.val()]));
    if(sec==='popular') arr.sort((a,b)=>b[1].likes - a[1].likes);
    else arr.sort((a,b)=>b[1].timestamp - a[1].timestamp);
    arr.forEach(([k,p])=> postsEl.appendChild(renderPost(k,p)));
  });
}

function logout(){ localStorage.removeItem('xchat_user'); location.reload(); }
</script>
</body>
</html>
